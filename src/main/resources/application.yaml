spring:
  application:
    name: backend-library
  datasource:
    url: jdbc:postgresql://localhost:5432/library_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  access-expiration: ${AUTH_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${AUTH_REFRESH_EXPIRATION:604800000}
  issuer: auth-service

app:
  cookie:
    secure: false
