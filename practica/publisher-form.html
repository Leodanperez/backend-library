<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nueva Editorial | Biblioteca</title>

    <link rel="stylesheet" href="./css/publisher.css" />
  </head>

  <body>
    <main class="container">
      <header class="page-header">
        <div>
          <h1>Nueva editorial</h1>
          <p>Registra la información de una nueva editorial.</p>
        </div>
      </header>

      <section class="card form-card">
        <div class="section-header">
          <h2>Información de la editorial</h2>
          <p>Completa los siguientes campos.</p>
        </div>

        <form class="form-grid">
          <div class="form-group">
            <label for="name">Nombre</label>

            <input type="text" id="name" placeholder="Ej. Editorial Planeta" />
          </div>

          <div class="form-group">
            <label for="country">País</label>

            <input type="text" id="country" placeholder="Ej. España" />
          </div>

          <div class="form-group">
            <label for="year">Año de fundación</label>

            <input type="number" id="year" placeholder="Ej. 1949" />
          </div>

          <div class="form-group">
            <label for="website">Sitio web</label>

            <input
              type="url"
              id="website"
              placeholder="https://www.ejemplo.com"
            />
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-primary">Guardar</button>

            <a href="publisher.html" class="btn btn-secondary"> Cancelar </a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
