<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nueva Ubicación | Biblioteca</title>

    <link rel="stylesheet" href="./css/locations.css" />
  </head>

  <body>
    <main class="container">
      <header class="page-header">
        <div>
          <h1>Nueva ubicación</h1>
          <p>Registra una nueva ubicación para la biblioteca.</p>
        </div>
      </header>

      <section class="card form-card">
        <div class="section-header">
          <h2>Información de la ubicación</h2>
          <p>Completa los siguientes campos.</p>
        </div>

        <form class="form-grid">
          <div class="form-group">
            <label for="name">Nombre</label>

            <input type="text" id="name" placeholder="Ej. Sala de Lectura" />
          </div>

          <div class="form-group">
            <label for="floor">Piso</label>

            <input type="number" id="floor" placeholder="Ej. 1" />
          </div>

          <div class="form-group">
            <label for="capacity">Capacidad</label>

            <input type="number" id="capacity" placeholder="Ej. 50" />
          </div>

          <div class="form-group full-width">
            <label for="description">Descripción</label>

            <textarea
              id="description"
              rows="5"
              placeholder="Describe la ubicación..."
            ></textarea>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-primary">Guardar</button>

            <a href="locations.html" class="btn btn-secondary"> Cancelar </a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
